name: Import upstream yt-dlp into base

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/import-ytdlp.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: import-ytdlp-base
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout ytdlp.cpp
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Fetch upstream yt-dlp source
        run: |
          git clone --depth 1 https://github.com/yt-dlp/yt-dlp.git "$RUNNER_TEMP/yt-dlp-upstream"
          git -C "$RUNNER_TEMP/yt-dlp-upstream" rev-parse HEAD > UPSTREAM_REVISION.txt

      - name: Import source tree into base/
        run: |
          mkdir -p base
          rsync -a --delete --exclude=".git" "$RUNNER_TEMP/yt-dlp-upstream/" base/

      - name: Redact credentials blocked by repository push protection
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("base/yt_dlp/extractor/shahid.py")
          source = path.read_text(encoding="utf-8")
          source, api_count = re.subn(
              r"(?m)^(\s*_AWS_API_KEY\s*=).*$",
              r"\1 'REDACTED_UPSTREAM_CREDENTIAL'",
              source,
          )
          source, access_count = re.subn(
              r"(?m)^(\s*['\"]access_key['\"]\s*:\s*).*$",
              r"\1'REDACTED_UPSTREAM_CREDENTIAL',",
              source,
          )
          source, secret_count = re.subn(
              r"(?m)^(\s*['\"]secret_key['\"]\s*:\s*).*$",
              r"\1'REDACTED_UPSTREAM_CREDENTIAL',",
              source,
          )
          print(f"Credential fields matched: API={api_count}, access={access_count}, secret={secret_count}")
          if not (api_count and access_count and secret_count):
              raise SystemExit("Expected credential fields were not found; stop rather than import unreviewed values.")
          path.write_text(source, encoding="utf-8")
          Path("base/IMPORT_REDACTIONS.md").write_text(
              "# Import redactions\n\n"
              "GitHub push protection flagged three credential-like values in "
              "yt_dlp/extractor/shahid.py. Their values were replaced with "
              "REDACTED_UPSTREAM_CREDENTIAL so they are not copied into this repository. "
              "The upstream Shahid extractor in this reference snapshot is intentionally "
              "not usable as-is; native C++ porting must use legitimate, non-secret configuration.\n",
              encoding="utf-8",
          )
          PY

      - name: Add native porting plan
        run: |
          cat > PORTING_PLAN.md <<'EOF'
          # yt-dlp to native C++ porting plan

          ## Source snapshot
          The unmodified upstream yt-dlp source tree is kept in base/.
          The exact upstream commit is recorded in UPSTREAM_REVISION.txt.
          Upstream source and its license notices must be preserved.

          ## Native implementation policy
          - Do not execute or embed Python at runtime.
          - Do not mechanically translate Python syntax without understanding behavior.
          - Keep base/ as the upstream reference snapshot; implement C++ code in src/ and public interfaces in include/.
          - Port behavior in small, testable modules and document each source-to-C++ mapping here.
          - Add regression tests that compare supported inputs/outputs with upstream behavior.
          - Never claim an extractor is ported until it has native tests.

          ## Initial mapping
          | Upstream Python area | Native C++ destination | Status |
          |---|---|---|
          | yt_dlp/networking/ | src/network/ | Planned |
          | yt_dlp/utils/ | src/utils/ | Planned |
          | yt_dlp/extractor/common.py | src/extractor/ | Planned |
          | yt_dlp/extractor/ site extractors | src/extractor/sites/ | Planned |
          | yt_dlp/YoutubeDL.py | src/core/ | Planned |

          ## First porting milestone
          1. Inspect upstream modules and dependencies.
          2. Define C++ URL, request, response, cookie, and error types.
          3. Add unit tests for URL parsing and HTTP behavior.
          4. Port a small extractor end-to-end before expanding coverage.
          EOF

      - name: Record import provenance
        run: |
          {
            echo "# Upstream source provenance"
            echo
            echo "- Repository: https://github.com/yt-dlp/yt-dlp"
            echo "- Imported commit: $(cat UPSTREAM_REVISION.txt)"
            echo "- Imported at (UTC): $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "- Source snapshot directory: base/"
            echo
            echo "The original source tree and its license notices are retained under base/."
          } > UPSTREAM.md

      - name: Commit imported source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add base PORTING_PLAN.md UPSTREAM.md UPSTREAM_REVISION.txt
          if git diff --cached --quiet; then
            echo "Upstream snapshot is already current; no commit needed."
            exit 0
          fi
          git commit -m "Import upstream yt-dlp source into base"
          git push origin HEAD:main
